[package]
name = "music-player"
version = "0.22.125"
edition = "2021"
description = "Native local-first music player core"
default-run = "music-player"

# The Windows binary calls music_player_lib::run() (src/lib.rs).
[lib]
name = "music_player_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Open URLs/files via the Windows default handler.
tauri-plugin-opener = "2"
discord-rich-presence = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native audio: decode (mp3/flac/wav/vorbis/…) + output to the system device.
# symphonia-aac + isomp4 let us decode YouTube m4a streams (see src/youtube.rs);
# 0.21+ is required for DecoderBuilder::with_byte_len, which the isomp4 demuxer
# needs to probe YouTube's moov-after-mdat files over HTTP.
rodio = { version = "0.21", features = ["symphonia-aac", "symphonia-isomp4"] }
# Blocking HTTP client for the range-request streaming source (src/stream.rs).
ureq = { version = "2", features = ["json"] }
# Tag reading (title/artist/album/duration). NOTE: lofty's module paths are
# version-sensitive — if cargo build complains, align this version + the imports
# at the top of src/library.rs (documented there).
lofty = "0.21"
walkdir = "2"
# Capability-relative opens keep duplicate hashing tied to already-open roots
# and reject every symlink/reparse component without pathname TOCTOU gaps.
cap-std = "4.0"
cap-fs-ext = "4.0"
base64 = "0.22"
# Wallpaper downscale before it reaches the WebView (read_image in src/library.rs):
# raw 4K+ wallpapers under a big CSS blur buffer choked the compositor (PC freeze).
# default-features off: no rayon / png exif extras we never use.
# "gif" is needed to DECODE and RE-ENCODE animated backgrounds. Without it a GIF
# could not be decoded at all, so it bypassed the downscaler entirely and was
# handed to the webview at full size — which is why only small ones worked.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# LAN device sharing (src/share.rs): a tiny sync HTTP server (host) + the ureq
# client already present. Pure Rust, with no external executable.
tiny_http = "0.12"
local-ip-address = "0.6"
sha2 = "0.10"
getrandom = "0.3"
# Native YouTube backend (Innertube client, NewPipe-style): powers search,
# playlists, channels, streaming and downloads without the yt-dlp binary.
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Matches the reqwest version rustypipe pulls (0.12).
reqwest = { version = "0.12", default-features = false }

# Windows SMTC media controls: volume flyout, headset transport buttons and
# the system "Now playing" surface.
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = { version = "0.8", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
# Launch at login through the Windows run key.
tauri-plugin-autostart = "2"



[profile.release]
opt-level = 3
lto = true
