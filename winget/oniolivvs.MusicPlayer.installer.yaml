# winget installer manifest, filled for v0.22.62.
#
# From v0.22.63 on, the `winget` job in .github/workflows/release.yml fills and
# submits these on its own — it needs the WINGET_TOKEN secret. This copy is kept
# current so a manual submission stays possible, and so the SHA256 of a shipped
# installer is recorded in the tree.
#
# Regenerating by hand: take the *-setup.exe URL from the release, hash it
# (`Get-FileHash -Algorithm SHA256` / `sha256sum`, uppercase hex), and bump
# PackageVersion in all three files together.
